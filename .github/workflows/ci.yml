name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

# A PR that gets a second push doesn't need the first run's answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 / v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Install
        # Fails rather than resolves if bun.lock disagrees with package.json, so CI can't
        # quietly test a different dependency tree than the one committed. Dependency
        # lifecycle scripts stay disabled; this app's build does not require them.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify security-sensitive build dependencies
        run: bun run security:verify-build-deps

      - name: Lint
        # `biome ci` rather than `bun run lint`, which is `biome check --write` — a formatter that
        # fixes what it finds reports success on a branch that was never formatted.
        run: bun run lint:ci

      - name: Typecheck and build
        # `tsc -b && vite build`. tsc covers the test files too (tsconfig.app.json includes all of
        # src), so a broken test type fails here rather than at the next person's `bun run build`.
        # No proto symlink needed: generated clients are committed, and only `bun run generate`
        # reads proto/.
        run: bun run build

      - name: Knip
        # Dead files, exports and dependencies. Ordered after tsc so an unresolved import — the one
        # failure both tools flag — is reported by the compiler rather than as knip noise. Generated
        # and vendored zones are in `ignore` in knip.jsonc, so it never proposes deleting code we don't own.
        run: bun run knip

      # Pinned rather than inherited: the usage tests assert UTC bucketing by contrasting it with a
      # western zone, and their comments claim CI runs in UTC. That was only ever true because
      # GitHub's runners default to it. Vitest runs on Node because Bun 1.3.14 currently
      # mis-evaluates Zod's namespace export in a subset of the suite.
      - name: Test
        run: node node_modules/vitest/vitest.mjs run
        env:
          TZ: UTC
