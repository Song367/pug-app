name: Release signed dashboard image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: dashboard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push immutable dashboard image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # Keep the action's immutable Git context so BuildKit provenance
          # contains the signed repository and commit material.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/song367/pug-dashboard:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=dashboard-release
          cache-to: type=gha,scope=dashboard-release,mode=max

      - name: Sign and verify immutable digest, provenance revision, and SBOM
        env:
          IMAGE: ghcr.io/song367/pug-dashboard
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          provenance="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}')"
          jq -e --arg revision "${GITHUB_SHA}" --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" '
            def normalize_source:
              ascii_downcase
              | sub("^git\\+"; "")
              | split("#")[0]
              | split("?")[0]
              | sub("\\.git$"; "");
            def is_github_source:
              (.uri? | type == "string") and
              ((.uri | normalize_source) | startswith("https://github.com/"));
            def authoritative_sources:
              [
                .invocation.configSource?,
                .predicate.invocation.configSource?
              ] | map(select(type == "object" and is_github_source));
            def fallback_sources:
              [
                .materials[]?,
                .buildDefinition.resolvedDependencies[]?,
                .predicate.materials[]?,
                .predicate.buildDefinition.resolvedDependencies[]?
              ] | map(select(type == "object" and is_github_source));
            def source_candidates:
              authoritative_sources as $authoritative
              | if ($authoritative | length) > 0 then $authoritative else fallback_sources end;
            def binds_source($expected_source; $expected_revision):
              source_candidates as $sources
              | ($sources | length) > 0 and
                all($sources[];
                  ((.uri? // "") | type == "string") and
                  ((.uri | normalize_source) == ($expected_source | normalize_source)) and
                  ((.digest? // {}) | type == "object") and
                  ([.digest.sha1?, .digest.gitCommit?]
                    | map(select(type == "string"))
                    | index($expected_revision) != null));
            [.. | objects | .SLSA? | select(type == "object")] as $slsa |
            ($slsa | length) > 0 and
            all($slsa[]; binds_source($source; $revision))
          ' <<<"${provenance}" >/dev/null
          sbom="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .SBOM}}')"
          jq -e '[.. | objects | .SPDXID? // empty] | index("SPDXRef-DOCUMENT") != null' \
            <<<"${sbom}" >/dev/null
